---
name: CI

on:
  pull_request:
    branches: [main, dx, testing, beta]
  push:
    branches: [main, dx, testing, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            python3-pytest \
            xvfb \
            xauth

      - name: Run tests
        run: xvfb-run -a python3 -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install just
        run: |
          curl -fsSL \
            https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --user --break-system-packages ruff
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Justfile syntax
        run: just --unstable --fmt --check -f Justfile

      - name: Shellcheck
        run: shellcheck -S warning build_files/build.sh build_files/ci/status-matrix.sh

      - name: Ruff
        run: |
          "${HOME}/.local/bin/ruff" check .

      - name: Actionlint
        run: |
          # Workflow expression/syntax lint. Shellcheck integration is
          # disabled here because the dedicated Shellcheck step covers
          # our scripts, and existing workflows carry info-level shell
          # style findings.
          actionlint -shellcheck ""
