---
name: CI

on:
  pull_request:
    branches: [main, dx, testing, beta]
  push:
    branches: [main, dx, testing, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-nm-1.0 \
            python3-pytest \
            xvfb \
            xauth

      - name: Run tests
        run: xvfb-run -a python3 -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install just
        run: |
          # GitHub's release CDN occasionally returns 504 for a single
          # pinned asset. Try the newest pin first, then a known-good
          # fallback instead of failing the whole lint job.
          for version in 1.59.0 1.58.0; do
            if curl -fsSL --retry 2 --max-time 60 \
              "https://github.com/casey/just/releases/download/${version}/just-${version}-x86_64-unknown-linux-musl.tar.gz" \
              | tar -xz -C /tmp just; then
              sudo install -m 0755 /tmp/just /usr/local/bin/just
              exit 0
            fi
          done
          echo "::error::could not download just" >&2
          exit 1

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --user --break-system-packages ruff
          for version in 1.7.7 1.7.1; do
            if curl -fsSL --retry 2 --max-time 60 \
              "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
              | tar -xz -C /tmp actionlint; then
              sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
              exit 0
            fi
          done
          echo "::error::could not download actionlint" >&2
          exit 1

      - name: Justfile syntax
        run: just --unstable --fmt --check -f Justfile

      - name: Shellcheck
        run: shellcheck -S warning build_files/build.sh build_files/ci/status-matrix.sh

      - name: Ruff
        run: |
          "${HOME}/.local/bin/ruff" check .

      - name: Actionlint
        run: |
          # Workflow expression/syntax lint. Shellcheck integration is
          # disabled here because the dedicated Shellcheck step covers
          # our scripts, and existing workflows carry info-level shell
          # style findings.
          actionlint -shellcheck ""

  panel:
    name: Panel build
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc \
            pkgconf-pkg-config \
            gtk4-devel \
            gtk4-layer-shell-devel \
            json-glib-devel \
            pulseaudio-libs-devel \
            pulseaudio-libs-glib2 \
            meson \
            ninja-build

      - name: Configure
        run: meson setup build panel

      - name: Compile
        run: meson compile -C build
