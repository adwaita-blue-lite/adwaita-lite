---
name: Build container image
on:
  pull_request:
    branches:
      - main
      - dx
      - testing
      - beta
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
      - dx
      - testing
      - beta
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      sync_promotion:
        description: "Internal stream sync promotion"
        required: false
        type: boolean
        default: false

env:
  IMAGE_DESC: "Adwaita-Lite: a Chromebook-inspired Universal Blue image for old low-RAM laptops"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,wayland,labwc,chromebook,low-ram"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "adwaita-lite"
  IMAGE_REGISTRY: "ghcr.io/adwaita-blue-lite"
  DEFAULT_TAG: "latest"
  # Pinned multi-arch cosign image (OCI index) pulled from GHCR at signing
  # time. Deliberately not a sigstore/cosign-installer release asset: the
  # GitHub Releases CDN returned HTTP 504 and blocked publication.
  COSIGN_IMAGE: "ghcr.io/sigstore/cosign/cosign@sha256:d91bc4e7e95e8d2f549c747a72dc174f90579e410a1695f57f686674f84ce849"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image (${{ matrix.stream }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stream: ${{ github.event_name == 'schedule' && fromJSON('["main","beta"]') || fromJSON('["main"]') }}
      max-parallel: 1

    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Resolve stream configuration
        id: stream
        shell: bash
        run: |
          publish="false"
          include_date_alias="false"
          tag="pr"
          base_image="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          ref_name="${GITHUB_REF_NAME}"
          upstream_refresh="false"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref_name="${GITHUB_BASE_REF}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            ref_name="${{ matrix.stream }}"
            upstream_refresh="true"
          fi

          case "${ref_name}" in
            main)
              publish="true"
              include_date_alias="true"
              tag="latest"
              base_image="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
              ;;
            dx)
              publish="true"
              tag="dx"
              base_image="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
              ;;
            testing)
              publish="true"
              tag="testing"
              base_image="${IMAGE_REGISTRY}/${IMAGE_NAME}:dx"
              ;;
            beta)
              publish="true"
              tag="beta"
              base_image="${IMAGE_REGISTRY}/${IMAGE_NAME}:beta"
              ;;
          esac

          if [[ "${upstream_refresh}" == "true" ]]; then
            case "${tag}" in
              latest) base_image="ghcr.io/ublue-os/base-main:latest" ;;
              beta) base_image="ghcr.io/ublue-os/base-main:beta" ;;
            esac
          fi

          # Bootstrap guard: routine builds layer on a previously published
          # image. A brand-new repo or stream has none yet, so fall back to
          # the matching upstream base instead of failing the registry pull.
          if [[ "${base_image}" == "${IMAGE_REGISTRY}/"* ]] \
             && ! skopeo inspect "docker://${base_image}" >/dev/null 2>&1; then
            case "${tag}" in
              beta) base_image="ghcr.io/ublue-os/base-main:beta" ;;
              *) base_image="ghcr.io/ublue-os/base-main:latest" ;;
            esac
            echo "Base ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag} is not published yet; bootstrapping from ${base_image}"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            publish="false"
            tag="pr"
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "include_date_alias=${include_date_alias}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "base_image=${base_image}" >> "${GITHUB_OUTPUT}"

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        if: github.event_name != 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Checkout scheduled stream
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ matrix.stream }}

      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Keep this inline so runner setup does not need to download another action archive.
      - name: Maximize build space
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Available space before cleanup"
          df -h

          verbose=""
          echo "Removing unwanted software..."
          sudo rm -rf ${verbose} /usr/share/dotnet
          sudo rm -rf ${verbose} /usr/local/lib/android
          sudo rm -rf ${verbose} /opt/ghc
          sudo rm -rf ${verbose} /usr/local/.ghcup
          sudo rm -rf ${verbose} /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          if [[ "$(uname -m)" == "x86_64" ]]; then
            sudo apt-get remove -y google-chrome-stable microsoft-edge-stable > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
            sudo apt-get remove -y powershell --fix-missing > /dev/null
          fi
          sudo apt-get remove -y azure-cli firefox mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null
          sudo rm -rf ${verbose} "$AGENT_TOOLSDIRECTORY"
          echo "... done"

          echo "==> Available space after cleanup"
          df -h

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ steps.stream.outputs.tag }},enable=${{ steps.stream.outputs.publish == 'true' }}
            type=raw,value=${{ steps.stream.outputs.tag }}.{{date 'YYYYMMDD'}},enable=${{ steps.stream.outputs.publish == 'true' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ steps.stream.outputs.include_date_alias == 'true' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ steps.source.outputs.revision }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ steps.source.outputs.revision }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ steps.source.outputs.revision }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ steps.source.outputs.revision }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.stream.outputs.tag }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=GPL-3.0-or-later
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      # Authenticate before building so stream builds can pull their own
      # previously published base image from GHCR (dx <- latest, testing <- dx).
      # Login happens once in the "Login to GHCR" step before stream resolution.

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          build-args: |
            BASE_IMAGE=${{ steps.stream.outputs.base_image }}

      # Rechunk is a script that we use on Universal Blue to make sure there isnt a single huge layer when your image gets published.
      # This does not make your image faster to download, just provides better resumability and fixes a few errors.
      # Documentation for Rechunk is provided on their github repository at https://github.com/hhd-dev/rechunk
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: ublue-os/legacy-rechunk@a925083d9af7cb04b3e2a6e8c01bfa495f38b710 # v1.0.0
      #   with:
      #     rechunk: 'ghcr.io/ublue-os/legacy-rechunk:v1.0.0-x86_64'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     labels: ${{ steps.metadata.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # Publication is fail-closed: the new image is pushed to an internal
      # staging tag, signed, and verified before any public tag is moved.
      # A failed sign/verify leaves `latest` (or the stream tag) untouched.
      - name: Push staging image
        id: push_staging
        if: steps.stream.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          staging_tag="${{ steps.stream.outputs.tag }}-staging-${GITHUB_SHA::12}"
          podman push --quiet --retry 3 --retry-delay 5s \
            --digestfile "${RUNNER_TEMP}/staging-digest" \
            "localhost/${IMAGE_NAME}:${{ steps.stream.outputs.tag }}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${staging_tag}"
          digest="$(tr -d '[:space:]' < "${RUNNER_TEMP}/staging-digest")"
          if [[ -z "${digest}" ]]; then
            echo "::error::podman push did not report a digest for ${staging_tag}"
            exit 1
          fi
          printf 'staging_tag=%s\ndigest=%s\n' "${staging_tag}" "${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Staged image (not yet public)"
            echo ""
            echo "- staging tag: \`${staging_tag}\`"
            echo "- digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # cosign (go-containerregistry) reads Docker's auth file, not podman's.
      # The earlier podman login covers buildah/base pulls; this covers signing.
      - name: Login to GHCR for signing
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.stream.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Signing uses cosign from a pinned container image. The previous
      # sigstore/cosign-installer action downloaded a release asset from the
      # GitHub Releases CDN, which returned HTTP 504 and blocked publication.
      - name: Install Cosign
        if: steps.stream.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cosign_image="${COSIGN_IMAGE}"
          for attempt in 1 2 3 4 5; do
            if podman pull --quiet "${cosign_image}"; then
              break
            fi
            echo "cosign image pull failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 5))
          done
          if ! podman image exists "${cosign_image}"; then
            echo "::error::Could not pull ${cosign_image}"
            exit 1
          fi

          # Wrapper so the sign/verify commands stay identical. The Docker
          # config written by docker/login-action is mounted read-only. The
          # cosign image runs as a non-root user, so run the container as root
          # to read the 0600 credential file.
          sudo tee /usr/local/bin/cosign >/dev/null <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec podman run --rm --user 0 \\
            --security-opt label=disable \\
            -e COSIGN_PRIVATE_KEY \\
            -e COSIGN_PASSWORD \\
            -e DOCKER_CONFIG=/root/.docker \\
            -v "\${HOME}/.docker/config.json:/root/.docker/config.json:ro" \\
            -v "\${PWD}:/work:ro" \\
            -w /work \\
            ${cosign_image} "\$@"
          EOF
          sudo chmod 0755 /usr/local/bin/cosign
          cosign version

      - name: Sign container image
        if: steps.stream.outputs.publish == 'true'
        shell: bash
        run: |
          # Keep the legacy bundle format so bootc/rpm-ostree can verify the
          # signature (same compatibility flags upstream Universal Blue uses).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push_staging.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # Required gate: no public tag is promoted unless this passes.
      - name: Verify container image signature
        if: steps.stream.outputs.publish == 'true'
        shell: bash
        run: |
          cosign verify \
            --key cosign.pub \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push_staging.outputs.digest }}"

      - name: Promote verified digest to public tags
        if: steps.stream.outputs.publish == 'true'
        shell: bash
        env:
          STREAM_TAG: ${{ steps.stream.outputs.tag }}
          STAGED_DIGEST: ${{ steps.push_staging.outputs.digest }}
          FINAL_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "${FINAL_TAGS//$'\n'/ }"

          # Promote date/alias tags first and the stream tag last, so a
          # partial failure cannot move the stream tag to a different digest.
          for tag in "${tags[@]}"; do
            [[ -z "${tag}" || "${tag}" == "${STREAM_TAG}" ]] && continue
            skopeo copy --retry-times 3 \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${STAGED_DIGEST}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            resolved="$(skopeo inspect --format '{{.Digest}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}")"
            if [[ "${resolved}" != "${STAGED_DIGEST}" ]]; then
              echo "::error::${tag} resolves to ${resolved}, expected ${STAGED_DIGEST}"
              exit 1
            fi
          done

          skopeo copy --retry-times 3 \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${STAGED_DIGEST}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${STREAM_TAG}"
          resolved="$(skopeo inspect --format '{{.Digest}}' \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${STREAM_TAG}")"
          if [[ "${resolved}" != "${STAGED_DIGEST}" ]]; then
            echo "::error::${STREAM_TAG} resolves to ${resolved}, expected ${STAGED_DIGEST}"
            exit 1
          fi

      # Defense in depth: prove the promoted stream tag resolves to a signed
      # image. The digest was already verified before promotion.
      - name: Verify promoted tag signature
        if: steps.stream.outputs.publish == 'true'
        shell: bash
        run: |
          cosign verify \
            --key cosign.pub \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.stream.outputs.tag }}"

      - name: Continue sync promotion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_promotion == true && steps.stream.outputs.tag == 'dx' && steps.stream.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-streams.yml \
            --ref main \
            -f source=dx \
            -f target=testing
