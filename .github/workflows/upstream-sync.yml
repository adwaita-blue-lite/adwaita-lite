---
name: Sync upstream image-template

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream into ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dx, testing, beta]
    concurrency:
      group: upstream-sync-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ublue-os/image-template.git
          git fetch --no-tags upstream main

      - name: Merge upstream into a sync branch
        id: merge
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sync_branch="upstream-sync/${BRANCH}/$(date -u +%Y%m%d)"
          echo "branch=${sync_branch}" >> "${GITHUB_OUTPUT}"
          git switch -C "${sync_branch}"

          if git merge --no-edit upstream/main; then
            if git diff --quiet "origin/${BRANCH}" HEAD; then
              echo "${BRANCH} is already aligned with upstream/main."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            git merge --abort
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update sync pull request
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ matrix.branch }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          git push --force -u origin "${SYNC_BRANCH}"

          existing_url=$(gh pr list \
            --base "${BASE_BRANCH}" \
            --head "${SYNC_BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url // ""')

          if [[ -n "${existing_url}" ]]; then
            echo "Sync PR already open: ${existing_url}"
            exit 0
          fi

          body=$(cat <<'EOF'
          Automated merge of `ublue-os/image-template` main into this stream.

          Review the diff and the image build before merging. This workflow never pushes directly to the branch.
          EOF
          )

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync upstream image-template into ${BASE_BRANCH} ($(date -u +%Y-%m-%d))" \
            --body "${body}"

      - name: Report a merge conflict
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          title="Upstream sync conflict: ${BRANCH} ($(date -u +%Y-%m-%d))"

          existing_number=$(gh issue list \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // ""')

          if [[ -n "${existing_number}" ]]; then
            echo "Conflict issue already open: #${existing_number}"
            exit 0
          fi

          body=$(cat <<'EOF'
          The automated upstream sync could not merge `ublue-os/image-template` into this stream.

          Resolve locally:

          ```bash
          git remote add upstream https://github.com/ublue-os/image-template.git
          git fetch upstream main
          git switch -C upstream-sync/manual
          git merge upstream/main
          # resolve conflicts, then:
          python3 -m pytest -q
          just check
          git push -u origin upstream-sync/manual
          ```

          Then open a PR against this branch from `upstream-sync/manual`.
          EOF
          )

          gh issue create --title "${title}" --body "${body}"
