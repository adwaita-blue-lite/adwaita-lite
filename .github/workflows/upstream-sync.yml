---
name: Sync upstream image-template

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify only; do not commit, push, or open a pull request"
        required: false
        type: boolean
        default: false

# Issue creation is intentionally not requested: GITHUB_TOKEN issue creation
# fails in this repository with "Resource not accessible by integration".
# Reporting uses pull requests, artifacts, and the step summary instead.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync upstream into ${{ matrix.branch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dx, testing, beta]
    concurrency:
      group: upstream-sync-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Apply reviewed upstream sync policy
        id: sync
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--base "${BRANCH}" --stream "${BRANCH}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          ./scripts/upstream-sync.sh "${args[@]}"

      - name: Upload owned-file drift patch
        if: always() && steps.sync.outputs.patch != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-drift-${{ matrix.branch }}-${{ github.run_id }}
          path: ${{ steps.sync.outputs.patch }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload blocked-sync report
        if: always() && steps.sync.outputs.conflict_report != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-sync-blocked-${{ matrix.branch }}-${{ github.run_id }}
          path: ${{ steps.sync.outputs.conflict_report }}
          if-no-files-found: error
          retention-days: 90

      - name: Open or update sync pull request
        if: success() && steps.sync.outputs.result != 'aligned' && steps.sync.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ matrix.branch }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
          RESULT: ${{ steps.sync.outputs.result }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          PATCH: ${{ steps.sync.outputs.patch }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="chore: sync upstream image-template into ${BASE_BRANCH} ($(date -u +%Y-%m-%d))"
          body_file="$(mktemp)"

          {
            printf '## Automated upstream sync — `%s`\n\n' "${BASE_BRANCH}"
            printf -- '- Upstream: [`ublue-os/image-template@%s`](https://github.com/ublue-os/image-template/commit/%s)\n' "${UPSTREAM_SHA:0:12}" "${UPSTREAM_SHA}"
            printf -- '- Result: `%s`\n' "${RESULT}"
            printf -- '- Date: `%s`\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [[ "${RESULT}" == "resolved-owned" ]]; then
              printf -- '- Owned-file drift patch: `%s`\n' "${PATCH}"
              printf -- '- Drift artifact: `upstream-drift-%s-%s` in [run %s](%s)\n' "${BASE_BRANCH}" "${RUN_ID}" "${RUN_ID}" "${RUN_URL}"
            fi
            printf '\nReview the full diff and let CI build the image before merging.\n'
            printf 'This pull request is updated in place on later runs; the workflow\n'
            printf 'never pushes directly to `%s`.\n\n' "${BASE_BRANCH}"
            if [[ "${RESULT}" == "resolved-owned" ]]; then
              printf '### Owned-file drift excerpt\n\n'
              printf 'The owned files kept the downstream version. The upstream delta\n'
              printf 'below was not applied and needs a weekly review.\n\n'
              printf '```diff\n'
              sed -n '1,300p' "${PATCH}"
              printf '```\n'
              patch_lines="$(wc -l <"${PATCH}")"
              if ((patch_lines > 300)); then
                printf '\nExcerpt truncated at 300 lines; see the artifact or `%s`.\n' "${PATCH}"
              fi
            fi
          } >"${body_file}"

          mapfile -t existing < <(
            gh pr list \
              --base "${BASE_BRANCH}" \
              --state open \
              --json number,headRefName,url \
              --jq '.[] | select(.headRefName | startswith("upstream-sync/'"${BASE_BRANCH}"'/")) | [.number, .headRefName, .url] | @tsv'
          )

          if ((${#existing[@]} > 0)); then
            IFS=$'\t' read -r pr_number pr_head pr_url <<<"${existing[0]}"
            git push --force -u origin "HEAD:${pr_head}"
            gh pr edit "${pr_number}" --title "${title}" --body-file "${body_file}"
            echo "Updated ${pr_url}"
          else
            git push --force -u origin "HEAD:${SYNC_BRANCH}"
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${title}" \
              --body-file "${body_file}"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          RESULT: ${{ steps.sync.outputs.result || 'unknown' }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          PATCH: ${{ steps.sync.outputs.patch }}
          CONFLICT_REPORT: ${{ steps.sync.outputs.conflict_report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '### Job result: `%s`\n\n' "${RESULT}"
            printf -- '- Upstream: `%s`\n' "${UPSTREAM_SHA:-unknown}"
            printf -- '- Drift patch: `%s`\n' "${PATCH:-none}"
            printf -- '- Blocked report: `%s`\n' "${CONFLICT_REPORT:-none}"
            printf -- '- Run: %s\n' "${RUN_URL}"
            if [[ "${RESULT}" == "blocked" ]]; then
              printf '\nThe merge was aborted because a non-owned path conflicts.\n'
              printf 'Classify it before re-running; do not resolve it with `ours`.\n'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
