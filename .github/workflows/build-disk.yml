---
name: Build disk images

on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      image-tag:
        description: "Container image tag to build disk images from"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - dx
          - testing
          - beta
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: "adwaita-lite"
  IMAGE_REGISTRY: "ghcr.io/adwaita-blue-lite"
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build disk images
    # Disk builds are preview artifacts. Until boot evidence exists, only
    # the daily schedule, manual dispatch, and disk-config PRs run; do not
    # rebuild on every main push.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["raw", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          IMAGE_TAG="${DEFAULT_TAG}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="${{ inputs.image-tag }}"
          fi
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Resolve image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          digest="$(skopeo inspect \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --format '{{.Digest}}' \
            "docker://${image}" 2>/dev/null || true)"
          if [[ -n "${digest}" ]]; then
            echo "ref=${image%@*}@${digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Could not resolve a registry digest for ${image}; using the tag"
            echo "ref=${image}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ steps.image.outputs.ref }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Write checksums and manifest
        shell: bash
        env:
          OUT_DIR: ${{ steps.build.outputs.output-directory }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          STREAM: ${{ env.IMAGE_TAG }}
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          set -euo pipefail
          export OUT_DIR="$(cd "${OUT_DIR}" && pwd)"
          cd "${OUT_DIR}"
          find . -type f ! -name SHA256SUMS ! -name manifest.json -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          out = os.environ["OUT_DIR"]
          files = []
          with open(os.path.join(out, "SHA256SUMS"), encoding="utf-8") as fh:
              for line in fh:
                  digest, path = line.rstrip("\n").split("  ", 1)
                  files.append({
                      "path": path,
                      "sha256": digest,
                      "size": os.path.getsize(os.path.join(out, path)),
                  })

          manifest = {
              "schema": 1,
              "status": "preview",
              "stream": os.environ["STREAM"],
              "disk_type": os.environ["DISK_TYPE"],
              "git_sha": os.environ["GIT_SHA"],
              "run_id": os.environ["RUN_ID"],
              "image_ref": os.environ["IMAGE_REF"],
              "created_at": datetime.now(timezone.utc).isoformat(),
              "files": files,
              "boot_evidence": None,
          }
          with open(os.path.join(out, "manifest.json"), "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
          PY
          sha256sum -c SHA256SUMS

      - name: Upload disk images and Checksum to Job Artifacts
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.upload-to-s3 != true)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adwaita-lite-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
