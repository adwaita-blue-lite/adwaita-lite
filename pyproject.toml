[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["files/usr/lib/adwaita-lite"]
addopts = "-q"
filterwarnings = [
    "ignore:GLib.unix_signal_add_full is deprecated",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".worktrees",
    "__pycache__",
    "docs",
    "po",
    "files/usr/share",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402",  # imports after sys.path setup in extensionless entry points
    "E501",  # long CSS/template lines are intentional
]
